<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#98d918" />
	<meta name="application-name" content="Cuenta TR" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap"
		rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
		rel="stylesheet" />
	<link rel="manifest" href="../manifest.webmanifest" />
	<link rel="icon" href="../img/icon-192.png" />
	<link rel="apple-touch-icon" href="../img/icon-192.png" />
	<link href="../CSS/index.css" rel="stylesheet" />
	<link href="../CSS/wallet.css" rel="stylesheet" />
	<title>Cartera - Cuenta TR</title>
</head>

<body class="wallet-shell">
	<main class="wallet-app">
		<header class="wallet-topbar">
			<div class="wallet-brand">
				<div class="wallet-brand-badge" aria-hidden="true">
					<img src="../img/TR Icono.png" alt="" />
				</div>
				<div class="wallet-title-wrap">
					<h1 id="wallet-user-name" class="wallet-title">
						Cargando...
					</h1>

					<p class="wallet-subtitle">
						Cartera TR
					</p>
				</div>
			</div>
			<div class="wallet-top-actions" aria-label="Controles de la cuenta">
				<button class="wallet-icon-button" type="button" aria-label="Seguridad">
					<span class="material-symbols-outlined">shield</span>
				</button>
				<button class="wallet-icon-button" type="button" aria-label="Notificaciones">
					<span class="material-symbols-outlined">notifications</span>
				</button>
			</div>
		</header>

		<section class="wallet-card balance-card" aria-labelledby="balance-title">
			<p id="balance-title" class="balance-label">Saldo Total</p>
			<div class="balance-amount-row" aria-label="Saldo disponible">
				<h2 id="wallet-balance" class="balance-amount">
					--.--
				</h2>

				<span id="wallet-currency" class="balance-currency">
					---
				</span>
			</div>
			<div class="balance-pill">
				<span class="material-symbols-outlined" aria-hidden="true">verified_user</span>
				<span>Cuenta Protegida</span>
			</div>

			<p id="wallet-response" class="wallet-response" aria-live="polite"></p>
		</section>

		<section class="quick-actions" aria-label="Acciones rápidas">
			<button id="open-transfer-button" class="quick-action send" type="button">
				<span class="quick-action-icon" aria-hidden="true">
					<span class="material-symbols-outlined">send</span>
				</span>
				<span class="quick-action-label">Enviar<br />Remesa</span>
			</button>

			<button class="quick-action receive" type="button">
				<span class="quick-action-icon" aria-hidden="true">
					<span class="material-symbols-outlined">download</span>
				</span>
				<span class="quick-action-label">Recibir</span>
			</button>

			<button class="quick-action topup" type="button">
				<span class="quick-action-icon" aria-hidden="true">
					<span class="material-symbols-outlined">credit_card</span>
				</span>
				<span class="quick-action-label">Cargar<br />Saldo</span>
			</button>
		</section>

		<section class="activity-header" aria-labelledby="recent-activity-title">
			<h2 id="recent-activity-title" class="activity-title">Actividad Reciente</h2>
			<a class="activity-link" href="#">Ver Todo</a>
		</section>

		<section id="wallet-activity-list" class="activity-list" aria-label="Lista de movimientos recientes">
			<p class="wallet-empty-activity">
				Cargando movimientos...
			</p>
		</section>
	</main>

	<div id="transfer-modal" class="transfer-modal hidden" role="dialog" aria-modal="true"
		aria-labelledby="transfer-modal-title">
		<div class="transfer-panel">
			<button id="close-transfer-button" class="transfer-close-button" type="button"
				aria-label="Cerrar formulario">
				×
			</button>

			<h2 id="transfer-modal-title" class="transfer-title">
				Enviar fondos
			</h2>

			<p class="transfer-subtitle">
				Envía USDT a otro usuario de Cuenta TR.
			</p>

			<div class="transfer-field">
				<label for="transfer-email">
					Correo del destinatario
				</label>

				<input id="transfer-email" type="email" placeholder="usuario@email.com" autocomplete="email" />

				<span id="transfer-email-error" class="transfer-field-error"></span>
			</div>

			<div class="transfer-field">
				<label for="transfer-amount">
					Monto
				</label>

				<div class="transfer-amount-input">
					<input id="transfer-amount" type="text" placeholder="0,00" inputmode="numeric" autocomplete="off" />

					<span>USDT</span>
				</div>

				<span id="transfer-amount-error" class="transfer-field-error"></span>
			</div>

			<p id="transfer-response" class="transfer-response" aria-live="polite"></p>

			<div class="transfer-actions">
				<button id="cancel-transfer-button" class="secondary-button" type="button">
					Cancelar
				</button>

				<button id="confirm-transfer-button" class="submit-button" type="button">
					Enviar
				</button>
			</div>
		</div>
	</div>

	<nav class="bottom-nav" aria-label="Navegación principal">
		<div class="bottom-nav-list">
			<button class="bottom-nav-item active" type="button" aria-current="page">
				<span class="material-symbols-outlined">account_balance_wallet</span>
				<span class="bottom-nav-label">Wallet</span>
			</button>
			<button class="bottom-nav-item" type="button">
				<span class="material-symbols-outlined">send</span>
				<span class="bottom-nav-label">Send</span>
			</button>
			<button class="bottom-nav-item" type="button">
				<span class="material-symbols-outlined">group</span>
				<span class="bottom-nav-label">Aliados</span>
			</button>
			<button class="bottom-nav-item" type="button">
				<span class="material-symbols-outlined">history</span>
				<span class="bottom-nav-label">History</span>
			</button>
			<button class="bottom-nav-item" type="button">
				<span class="material-symbols-outlined">person</span>
				<span class="bottom-nav-label">Profile</span>
			</button>
		</div>
	</nav>
	<script src="../JS/vendor/simplewebauthn-browser.js">
	</script>
	<script src="../JS/config/appConfig.js"></script>
	<script src="../JS/passkey/passkeyService.js"></script>
	<script src="../JS/wallet/walletService.js"></script>
	<script src="../JS/wallet/walletController.js"></script>
	<script src="../JS/wallet/walletUI.js"></script>
	<script src="../JS/pwa.js"></script>
</body>

</html>
